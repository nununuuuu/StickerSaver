name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          set -euo pipefail
          cat project.parts/part-* > project.zip.b64
          base64 --decode project.zip.b64 > project.zip
          unzip -t project.zip
          mkdir -p project
          unzip -q project.zip -d project
          cp overrides/Models.kt project/app/src/main/java/com/local/threadssticker/Models.kt
          cp overrides/AppStore.kt project/app/src/main/java/com/local/threadssticker/AppStore.kt
          cp overrides/StickerRepository.kt project/app/src/main/java/com/local/threadssticker/StickerRepository.kt
          cp overrides/ThreadsParser.kt project/app/src/main/java/com/local/threadssticker/ThreadsParser.kt
          cp overrides/AppUi.kt project/app/src/main/java/com/local/threadssticker/AppUi.kt
          cp overrides/MainActivity.kt project/app/src/main/java/com/local/threadssticker/MainActivity.kt
          cp overrides/UpdateChecker.kt project/app/src/main/java/com/local/threadssticker/UpdateChecker.kt
          cp overrides/app-build.gradle.kts project/app/build.gradle.kts
          mkdir -p project/app/src/main/res/drawable
          mkdir -p project/app/src/main/res/values
          mkdir -p project/app/src/main/res/mipmap-anydpi-v26
          mkdir -p project/app/src/main/res/xml
          cp overrides/resources/drawable/ic_sticker_saver_foreground.xml project/app/src/main/res/drawable/ic_sticker_saver_foreground.xml
          cp overrides/resources/values/sticker_saver_icon.xml project/app/src/main/res/values/sticker_saver_icon.xml
          cp overrides/resources/mipmap-anydpi-v26/ic_launcher.xml project/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp overrides/resources/mipmap-anydpi-v26/ic_launcher_round.xml project/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp overrides/resources/xml/file_paths.xml project/app/src/main/res/xml/file_paths.xml
          base64 --decode overrides/resources/sticker_saver_icon.webp.b64 > project/app/src/main/res/drawable/sticker_saver_icon.webp
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">Sticker Saver</string>#' project/app/src/main/res/values/strings.xml
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("project/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          if "android.permission.REQUEST_INSTALL_PACKAGES" not in s:
              s = s.replace(
                  "<application",
                  '<uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application',
                  1,
              )

          if ".fileprovider" not in s:
              provider = '''        <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="${applicationId}.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                  <meta-data
                      android:name="android.support.FILE_PROVIDER_PATHS"
                      android:resource="@xml/file_paths" />
              </provider>
          '''
              s = s.replace("</application>", provider + "    </application>")

          s = re.sub(r'android:icon="@[^"]+"', 'android:icon="@drawable/sticker_saver_icon"', s, count=1)
          if 'android:roundIcon=' in s:
              s = re.sub(r'android:roundIcon="@[^"]+"', 'android:roundIcon="@drawable/sticker_saver_icon"', s, count=1)
          else:
              s = s.replace("<application", '<application android:roundIcon="@drawable/sticker_saver_icon"', 1)

          if "android.intent.action.SEND" not in s:
              share_filter = '''
                  <intent-filter>
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="text/plain" />
                  </intent-filter>
              '''
              m = re.search(r'(<activity\b[^>]*android:name="(?:\.MainActivity|com\.local\.threadssticker\.MainActivity)"[^>]*>)(.*?)(</activity>)', s, re.S)
              if m:
                  s = s[:m.start(3)] + share_filter + s[m.start(3):]

          p.write_text(s)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Read version and prepare APK
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' project/app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp project/app/build/outputs/apk/debug/app-debug.apk "StickerSaver-v${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickerSaver-v${{ steps.version.outputs.version }}-apk
          path: StickerSaver-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          APK="StickerSaver-v${VERSION}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "$APK" --title "$TAG" --notes-file RELEASE_NOTES.md
          fi
