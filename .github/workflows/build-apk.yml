name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          set -euo pipefail
          cat project.parts/part-* > project.zip.b64
          base64 --decode project.zip.b64 > project.zip
          unzip -t project.zip
          mkdir -p project
          unzip -q project.zip -d project

          cp overrides/ThreadsParser.kt project/app/src/main/java/com/local/threadssticker/ThreadsParser.kt

          sed -i 's/compileSdk = 37/compileSdk = 36/g' project/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/g' project/app/build.gradle.kts
          sed -i 's/compose-bom:2026.08.00/compose-bom:2025.08.00/g' project/app/build.gradle.kts
          sed -i 's/activity-compose:1.11.0/activity-compose:1.10.1/g' project/app/build.gradle.kts
          sed -i 's/core-ktx:1.19.0/core-ktx:1.16.0/g' project/app/build.gradle.kts
          sed -i 's/lifecycle-runtime-ktx:2.11.0/lifecycle-runtime-ktx:2.9.2/g' project/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Prepare APK
        shell: bash
        run: cp project/app/build/outputs/apk/debug/app-debug.apk ThreadsSticker-latest-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreadsSticker-debug-apk
          path: ThreadsSticker-latest-debug.apk
          if-no-files-found: error

      - name: Publish direct-download test release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete latest-test --cleanup-tag --yes || true
          gh release create latest-test ThreadsSticker-latest-debug.apk --title "Latest Test APK" --notes "Latest debug build generated automatically from main."
