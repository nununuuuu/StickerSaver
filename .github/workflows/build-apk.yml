name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          set -euo pipefail
          cat project.parts/part-* | tr -cd 'A-Za-z0-9+/=' > project.zip.b64
          count=$(wc -c < project.zip.b64)
          echo "Clean Base64 length: $count"
          rem=$((count % 4))
          if [ "$rem" -eq 2 ]; then printf '==' >> project.zip.b64; fi
          if [ "$rem" -eq 3 ]; then printf '=' >> project.zip.b64; fi
          if [ "$rem" -eq 1 ]; then echo "Invalid Base64 length"; exit 1; fi
          base64 --decode project.zip.b64 > project.zip
          unzip -t project.zip
          mkdir -p project
          unzip -q project.zip -d project

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.0.0'

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ThreadsSticker-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
