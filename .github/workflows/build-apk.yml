name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          set -euo pipefail
          cat project.parts/part-* > project.zip.b64
          base64 --decode project.zip.b64 > project.zip
          unzip -t project.zip
          mkdir -p project
          unzip -q project.zip -d project
          cp overrides/Models.kt project/app/src/main/java/com/local/threadssticker/Models.kt
          cp overrides/AppStore.kt project/app/src/main/java/com/local/threadssticker/AppStore.kt
          base64 --decode overrides/StickerRepository.kt.b64 > project/app/src/main/java/com/local/threadssticker/StickerRepository.kt
          base64 --decode overrides/ThreadsParser.kt.b64 | gzip --decompress > project/app/src/main/java/com/local/threadssticker/ThreadsParser.kt
          cp overrides/AppUi.kt project/app/src/main/java/com/local/threadssticker/AppUi.kt
          cp overrides/UpdateChecker.kt project/app/src/main/java/com/local/threadssticker/UpdateChecker.kt
          cp overrides/app-build.gradle.kts project/app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Read version and prepare APK
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' project/app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp project/app/build/outputs/apk/debug/app-debug.apk "ThreadsSticker-v${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreadsSticker-v${{ steps.version.outputs.version }}-apk
          path: ThreadsSticker-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          APK="ThreadsSticker-v${VERSION}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "$APK" --title "$TAG" --notes-file RELEASE_NOTES.md
          fi
