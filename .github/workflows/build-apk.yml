name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          set -euo pipefail
          cat project.parts/part-* > project.zip.b64
          base64 --decode project.zip.b64 > project.zip
          unzip -t project.zip
          mkdir -p project
          unzip -q project.zip -d project
          cp overrides/Models.kt project/app/src/main/java/com/local/threadssticker/Models.kt
          cp overrides/AppStore.kt project/app/src/main/java/com/local/threadssticker/AppStore.kt
          cp overrides/StickerRepository.kt project/app/src/main/java/com/local/threadssticker/StickerRepository.kt
          cp overrides/ThreadsParser.kt project/app/src/main/java/com/local/threadssticker/ThreadsParser.kt
          cp overrides/AppUi.kt project/app/src/main/java/com/local/threadssticker/AppUi.kt
          cp overrides/MainActivity.kt project/app/src/main/java/com/local/threadssticker/MainActivity.kt
          cp overrides/UpdateChecker.kt project/app/src/main/java/com/local/threadssticker/UpdateChecker.kt
          cp overrides/app-build.gradle.kts project/app/build.gradle.kts
          mkdir -p project/app/src/main/res/drawable
          mkdir -p project/app/src/main/res/values
          mkdir -p project/app/src/main/res/mipmap-anydpi-v26
          mkdir -p project/app/src/main/res/xml
          cp overrides/resources/drawable/ic_sticker_saver_foreground.xml project/app/src/main/res/drawable/ic_sticker_saver_foreground.xml
          cp overrides/resources/values/sticker_saver_icon.xml project/app/src/main/res/values/sticker_saver_icon.xml
          cp overrides/resources/mipmap-anydpi-v26/ic_launcher.xml project/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp overrides/resources/mipmap-anydpi-v26/ic_launcher_round.xml project/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          cp overrides/resources/mipmap-anydpi-v26/ic_sticker_saver_launcher.xml project/app/src/main/res/mipmap-anydpi-v26/ic_sticker_saver_launcher.xml
          cp overrides/resources/mipmap-anydpi-v26/ic_sticker_saver_launcher_round.xml project/app/src/main/res/mipmap-anydpi-v26/ic_sticker_saver_launcher_round.xml
          cp overrides/resources/xml/file_paths.xml project/app/src/main/res/xml/file_paths.xml
          base64 --decode overrides/resources/sticker_saver_icon.jpg.b64 > project/app/src/main/res/drawable/sticker_saver_icon.jpg
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">Sticker Saver</string>#' project/app/src/main/res/values/strings.xml
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("project/app/src/main/AndroidManifest.xml")
          android_ns = "http://schemas.android.com/apk/res/android"
          A = "{" + android_ns + "}"
          ET.register_namespace("android", android_ns)

          tree = ET.parse(p)
          root = tree.getroot()
          app = root.find("application")
          if app is None:
              raise RuntimeError("Application element not found in AndroidManifest.xml")

          if not any(
              node.get(A + "name") == "android.permission.REQUEST_INSTALL_PACKAGES"
              for node in root.findall("uses-permission")
          ):
              perm = ET.Element("uses-permission")
              perm.set(A + "name", "android.permission.REQUEST_INSTALL_PACKAGES")
              root.insert(0, perm)

          app.set(A + "icon", "@mipmap/ic_sticker_saver_launcher")
          app.set(A + "roundIcon", "@mipmap/ic_sticker_saver_launcher_round")

          provider = None
          for node in app.findall("provider"):
              if node.get(A + "authorities") == "${applicationId}.fileprovider":
                  provider = node
                  break
          if provider is None:
              provider = ET.SubElement(app, "provider")
              provider.set(A + "name", "androidx.core.content.FileProvider")
              provider.set(A + "authorities", "${applicationId}.fileprovider")
              provider.set(A + "exported", "false")
              provider.set(A + "grantUriPermissions", "true")
              meta = ET.SubElement(provider, "meta-data")
              meta.set(A + "name", "android.support.FILE_PROVIDER_PATHS")
              meta.set(A + "resource", "@xml/file_paths")

          main = None
          for activity in app.findall("activity"):
              name = activity.get(A + "name", "")
              if name in (".MainActivity", "com.local.threadssticker.MainActivity"):
                  main = activity
                  break
          if main is None:
              raise RuntimeError("MainActivity not found in AndroidManifest.xml")

          main.set(A + "launchMode", "singleTask")

          has_send = False
          for intent_filter in main.findall("intent-filter"):
              for action in intent_filter.findall("action"):
                  if action.get(A + "name") == "android.intent.action.SEND":
                      has_send = True
                      break
              if has_send:
                  break

          if not has_send:
              intent_filter = ET.SubElement(main, "intent-filter")
              action = ET.SubElement(intent_filter, "action")
              action.set(A + "name", "android.intent.action.SEND")
              category = ET.SubElement(intent_filter, "category")
              category.set(A + "name", "android.intent.category.DEFAULT")
              data = ET.SubElement(intent_filter, "data")
              data.set(A + "mimeType", "text/plain")

          tree.write(p, encoding="utf-8", xml_declaration=True)
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Read version and prepare APK
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' project/app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp project/app/build/outputs/apk/debug/app-debug.apk "StickerSaver-v${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickerSaver-v${{ steps.version.outputs.version }}-apk
          path: StickerSaver-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          APK="StickerSaver-v${VERSION}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "$APK" --title "$TAG" --notes-file RELEASE_NOTES.md
          fi
