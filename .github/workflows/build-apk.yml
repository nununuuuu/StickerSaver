name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SIGNING_KEYSTORE_PATH: release-keystore.jks

    steps:
      - uses: actions/checkout@v4

      - name: Rebuild project archive
        shell: bash
        run: |
          set -euo pipefail
          cat project.parts/part-* > project.zip.b64
          base64 --decode project.zip.b64 > project.zip
          unzip -t project.zip
          rm -rf project
          mkdir -p project
          unzip -q project.zip -d project

      - name: Apply maintained project sources
        shell: bash
        run: |
          set -euo pipefail

          JAVA_DIR="project/app/src/main/java/com/local/threadssticker"
          RES_DIR="project/app/src/main/res"

          cp overrides/Models.kt "$JAVA_DIR/Models.kt"
          cp overrides/AppStore.kt "$JAVA_DIR/AppStore.kt"
          cp overrides/StickerRepository.kt "$JAVA_DIR/StickerRepository.kt"
          cp overrides/ThreadsParser.kt "$JAVA_DIR/ThreadsParser.kt"
          cp overrides/AppUi.kt "$JAVA_DIR/AppUi.kt"
          cp overrides/MainActivity.kt "$JAVA_DIR/MainActivity.kt"
          cp overrides/StickerKeyboardService.kt "$JAVA_DIR/StickerKeyboardService.kt"
          cp overrides/UpdateChecker.kt "$JAVA_DIR/UpdateChecker.kt"
          cp overrides/app-build.gradle.kts project/app/build.gradle.kts

          cp overrides/AndroidManifest.xml project/app/src/main/AndroidManifest.xml

          mkdir -p "$RES_DIR/drawable" "$RES_DIR/values" "$RES_DIR/xml"
          cp overrides/resources/values/strings.xml "$RES_DIR/values/strings.xml"
          cp overrides/resources/xml/file_paths.xml "$RES_DIR/xml/file_paths.xml"
          rm -f "$RES_DIR/drawable/sticker_saver_icon."*
          base64 --decode overrides/resources/sticker_saver_icon.jpg.b64 > "$RES_DIR/drawable/sticker_saver_icon.jpg"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore fixed release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::error::Missing Android release signing secrets."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > project/app/release-keystore.jks
          keytool -list             -keystore project/app/release-keystore.jks             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed release APK
        working-directory: project
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="project/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/36.0.0/aapt2"

          "$APKSIGNER" verify --verbose --print-certs "$APK"

          BADGING="$("$AAPT2" dump badging "$APK")"
          RESOURCES="$("$AAPT2" dump resources "$APK")"

          echo "$BADGING" | grep -F "application-label:'Sticker Saver'"
          echo "$BADGING" | grep -F "launchable-activity: name='com.local.threadssticker.MainActivity'  label='Sticker Saver'"
          echo "$RESOURCES" | grep -F "drawable/sticker_saver_icon"

      - name: Read version and prepare APK
        id: version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' project/app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp project/app/build/outputs/apk/release/app-release.apk "StickerSaver-v${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StickerSaver-v${{ steps.version.outputs.version }}-apk
          path: StickerSaver-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          TAG="v${VERSION}"
          APK="StickerSaver-v${VERSION}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file RELEASE_NOTES.md
          else
            gh release create "$TAG" "$APK" --title "$TAG" --notes-file RELEASE_NOTES.md
          fi
